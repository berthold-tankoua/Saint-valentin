<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Kemi 💖</title>
    <meta name="description"
        content="Une surprise spéciale pour ma busy Kemi, ouvre le site web et découvre le jeu que j'ai mis en place, un petit geste drole et fun pour la saint-valentin.">

    <style>
        :root {
            --primary: #ff4d6d;
            --secondary: #ffb6c1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, var(--secondary), var(--primary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Poppins, system-ui, sans-serif;
            padding: 20px;
            overflow: hidden;
        }

        .card {
            background: #fff;
            border-radius: 24px;
            padding: 30px 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, .25);
            animation: fadeIn 1.2s ease;
        }

        h1 {
            color: var(--primary);
            font-size: clamp(22px, 5vw, 30px);
        }

        .subtitle {
            font-size: 18px;
            margin: 14px 0 22px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 22px;
        }

        @media(max-width:600px) {
            .buttons {
                flex-direction: column;
            }
        }

        button {
            border: none;
            padding: 14px;
            font-size: 18px;
            border-radius: 999px;
            cursor: pointer;
            transition: .3s;
        }

        #yes {
            background: var(--primary);
            color: #fff;
            box-shadow: 0 12px 25px rgba(255, 77, 109, .45);
        }

        #yes:hover {
            transform: scale(1.07);
        }

        #no {
            background: #eee;
            color: #555;
        }

        /* GAME */
        .game {
            text-align: left;
            margin-top: 20px;
        }

        .rules {
            background: #fff0f4;
            border-radius: 16px;
            padding: 14px;
            font-size: 14px;
            margin-bottom: 16px;
        }

        .checklist label {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            cursor: pointer;
        }

        .checklist input {
            transform: scale(1.2);
            margin-top: 2px;
        }

        /* FINAL */
        .final {
            margin-top: 20px;
            background: #fff0f4;
            border-radius: 18px;
            padding: 18px;
            text-align: center;
        }

        .download-btn {
            display: inline-block;
            margin-top: 14px;
            padding: 12px 22px;
            background: var(--primary);
            color: #fff;
            text-decoration: none;
            border-radius: 999px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(255, 77, 109, .45);
        }

        /* Hearts */
        .heart {
            position: fixed;
            top: -10px;
            font-size: 28px;
            animation: fall linear infinite;
            pointer-events: none;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(.85);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="card" id="card">
        <img id="mainGif" src="gifs/heart-love.gif" alt="Animation AgenceDigitals" class="img-fluid">
        <h1> Busy Kemi 💘</h1>
        <div class="subtitle">Veux-tu être ma Valentine ?</div>

        <div class="buttons">
            <button id="yes">Oui 💖</button>
            <button id="no">Non 😢</button>
        </div>
    </div>
    <script>
        const gif = document.getElementById("mainGif");
        let gifList = [
            "gifs/myaowl.gif",
            "gifs/myaowl.gif",
        ];

        const card = document.getElementById("card");
        const yesBtn = document.getElementById("yes");
        const noBtn = document.getElementById("no");
        let scale = 1;
        let noTexts = [
            "Es-tu sûre ? 😶",
            "Vraiment sûre ? 🥺",
            "Pourquoi n'aimes-tu pas les bamis? 💔",
            "Je suis triste 😭",
            "Dernière chance 💕"
        ];
        let index = 0;

        noBtn.addEventListener("click", () => {
            scale += 0.2;
            yesBtn.style.transform = `scale(${scale})`;

            noBtn.textContent = noTexts[index % noTexts.length];

            // Changer le GIF
            gif.src = gifList[index % gifList.length];
            index++;
        });
        document.getElementById("yes").onclick = startGame;

        function startGame() {
            card.innerHTML = `
             <img id="mainGif" src="gifs/cat.gif" alt="Animation AgenceDigitals" class="img-fluid">
        <h1>💖Ma valentine Kemi 💖</h1>
        <p style="color:#ff4d6d;font-size:18px;"
         Vivement le 14 pour passer un super moment ensemble 
        </p>

        <div class="game">
            <div class="rules">
                <strong style="font-size:18px">🎁 Jeu du cadeau caché</strong><br>
                <p style="margin-top:10px;">
                    Le 14 février, coche ou décoche les cases au fur et à mesure.
                    Quand tout est coché, le cadeau apparaît 💖
                </p>
            </div>

            <div class="checklist">
                <label>
                    <input type="checkbox" data-id="1">
                    💌 Lettre spéciale Saint-Valentin
                </label>
                <label>
                    <input type="checkbox" data-id="2">
                    🎁 Réception de ton cadeau (1/3)
                </label>
                <label>
                    <input type="checkbox" data-id="3">
                    🎁 Remise de mon cadeau
                </label>
                <label>
                    <input type="checkbox" data-id="4">
                    📹 Discussion vidéo en soirée
                </label>
            </div>

            <div id="final"></div>
        </div>
    `;
            launchHearts()
            restoreState();
            initGame();
        }

        /* Gestion des cases */
        function initGame() {
            document.querySelectorAll("input[type='checkbox']").forEach(cb => {
                cb.addEventListener("change", saveState);
            });
        }

        function saveState() {
            const state = {};
            document.querySelectorAll("input[type='checkbox']").forEach(cb => {
                state[cb.dataset.id] = cb.checked;
            });
            localStorage.setItem("valentineGame", JSON.stringify(state));
            checkWin();
        }

        function restoreState() {
            const saved = JSON.parse(localStorage.getItem("valentineGame"));
            if (!saved) return;

            document.querySelectorAll("input[type='checkbox']").forEach(cb => {
                cb.checked = saved[cb.dataset.id] || false;
            });

            checkWin();
        }

        function checkWin() {
            const checks = [...document.querySelectorAll("input[type='checkbox']")];
            const allChecked = checks.every(cb => cb.checked);

            if (allChecked) {
                showFinal();
                launchHearts();
            } else {
                document.getElementById("final").innerHTML = "";
            }
        }

        function showFinal() {
            document.getElementById("final").innerHTML = `
        <div class="final">
            💖 <strong>Merci pour ta participation, ma Valentine</strong><br>
            Voici le cadeau caché 🎁
            <br>
            <a target="_blank" href="https://drive.google.com/drive/folders/1S5rcE4sunE3YAgosiaBzAohMEljnZjQ6?usp=sharing"  class="download-btn">
                ⬇️ Télécharger le cadeau
            </a>
        </div>
    `;
        }

        /* Animation cœurs */
        function launchHearts() {
            for (let i = 0; i < 40; i++) {
                const h = document.createElement("div");
                h.className = "heart";
                h.textContent = Math.random() > 0.5 ? "💖" : "💘";
                h.style.left = Math.random() * 100 + "vw";
                h.style.animationDuration = 2 + Math.random() * 3 + "s";
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 6000);
            }
        }
    </script>

</body>

</html>
